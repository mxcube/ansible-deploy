---
# Main playbook to deploy MXCubeWeb on one or more VMs

- name: Deploy mxcubeweb on VMs
  hosts: mxcube_vms
  become: true

  tasks:
    - name: Install system dependencies
      ansible.builtin.package:
        name:
          - git
          - wget
          - curl
          - build-essential
          - python3
          - python3-pip
          - graphviz
          - redis-server
          - tmux
          - acl
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags: [system, dependencies]

    # Create the base installation directory for this VM
    - name: Create installation directory
      ansible.builtin.file:
        path: "{{ install_base_path }}"
        state: directory
        owner: "{{ service_user }}"
        mode: '0755'
      tags: [setup, directories]

    - name: Create log directory
      ansible.builtin.file:
        path: "{{ log_base_path }}"
        state: directory
        owner: "{{ service_user }}"
        mode: '0750'
        recurse: true
      tags: [setup, directories, logging]

    # user_db_path lives here rather than /tmp so it survives reboots and is
    # guaranteed writable by service_user, instead of relying on /tmp's loose
    # world-writable permissions.
    - name: Create data directory for mxcubeweb's user database
      ansible.builtin.file:
        path: "{{ install_base_path }}/data"
        state: directory
        owner: "{{ service_user }}"
        mode: '0750'
        recurse: true
      tags: [setup, directories]

    # Miniconda setup
    - name: Check if Miniconda is installed
      ansible.builtin.stat:
        path: "{{ install_base_path }}/miniconda/bin/conda"
      register: conda_installed
      tags: [conda, setup]

    - name: Download Miniconda
      ansible.builtin.get_url:
        url: "https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh"
        dest: "/tmp/miniconda.sh"
        mode: '0755'
      when: not conda_installed.stat.exists
      tags: [conda, setup]

    - name: Install Miniconda
      ansible.builtin.command:
        cmd: "bash /tmp/miniconda.sh -b -p {{ install_base_path }}/miniconda"
      when: not conda_installed.stat.exists
      changed_when: true
      tags: [conda, setup]

    # Runs on every deploy, not just a fresh install: if miniconda was
    # already installed under a different service_user (or from before
    # become was fixed to actually run as service_user), mamba/conda refuse
    # to write to caches/env metadata they don't own — same class of issue
    # as the git repo ownership fix above.
    - name: Set ownership of miniconda directory
      ansible.builtin.file:
        path: "{{ install_base_path }}/miniconda"
        owner: "{{ service_user }}"
        recurse: true
      tags: [conda, setup]

    - name: Initialize conda for bash
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/conda init bash"
      become_user: "{{ service_user }}"
      when: not conda_installed.stat.exists
      changed_when: true
      tags: [conda, setup]

    - name: Check if mamba is installed
      ansible.builtin.stat:
        path: "{{ install_base_path }}/miniconda/bin/mamba"
      register: mamba_installed
      tags: [conda, mamba, setup]

    - name: Accept Anaconda Terms of Service
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/conda tos accept --override-channels --channel {{ item }}"
      loop:
        - "https://repo.anaconda.com/pkgs/main"
        - "https://repo.anaconda.com/pkgs/r"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      tags: [conda, mamba, setup]

    - name: Install mamba in base environment
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/conda install mamba -n base -c conda-forge -y"
      environment:
        CONDA_SOLVER: classic
      become_user: "{{ service_user }}"
      become: true
      when: not mamba_installed.stat.exists
      changed_when: true
      async: 3600
      poll: 30
      tags: [conda, mamba, bliss]

    # Ensure ownership before cloning: if these directories already exist
    # from a previous deploy under a different service_user (or from before
    # become was fixed to actually run as service_user), git refuses to
    # operate on them at all ("detected dubious ownership") rather than
    # silently misbehaving. Re-owning here makes every deploy self-healing
    # regardless of what ran before it, without discarding existing git
    # history/objects (bliss in particular is a large repo not worth a full
    # re-clone on every run).
    - name: Ensure repository directories are owned by service_user
      ansible.builtin.file:
        path: "{{ install_base_path }}/{{ item }}"
        state: directory
        owner: "{{ service_user }}"
        recurse: true
      loop:
        - mxcubecore
        - mxcubeweb
        - bliss
      when: item != 'bliss' or use_bliss | default(false)
      tags: [git, repositories, update]

    # Clone repositories fresh on the target
    - name: Clone mxcubecore from GitHub
      ansible.builtin.git:
        repo: "{{ mxcubecore_repo }}"
        dest: "{{ install_base_path }}/mxcubecore"
        version: "{{ mxcubecore_version }}"
        force: true
      become_user: "{{ service_user }}"
      tags: [git, repositories, mxcubecore, update]

    - name: Clone mxcubeweb from GitHub
      ansible.builtin.git:
        repo: "{{ mxcubeweb_repo }}"
        dest: "{{ install_base_path }}/mxcubeweb"
        version: "{{ mxcubeweb_version }}"
        force: true
      become_user: "{{ service_user }}"
      tags: [git, repositories, mxcubeweb, update]

    - name: Clone bliss from GitLab
      ansible.builtin.git:
        repo: "{{ bliss_repo }}"
        dest: "{{ install_base_path }}/bliss"
        version: "{{ bliss_version }}"
        force: true
      become_user: "{{ service_user }}"
      when: use_bliss | default(false)
      tags: [git, repositories, bliss, update]

    # Hardware config (demo.yaml/, optionally overlaid per use_bliss/use_icat
    # below) — deployed after the clone so our simulator config replaces the
    # generic default that ships inside the mxcubeweb repo (also named "demo.yaml"
    # there, regardless of which variant we're about to deploy).
    - name: Remove default hardware-object config shipped with mxcubeweb
      ansible.builtin.file:
        path: "{{ install_base_path }}/mxcubeweb/demo.yaml"
        state: absent
      tags: [config, hardware-object]

    # Also clear our own previously-deployed config dir first, in case a
    # prior deploy used the other use_bliss variant, or left behind files
    # that are no longer part of this variant.
    - name: Remove previously-deployed hardware-object config
      ansible.builtin.file:
        path: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}"
        state: absent
      tags: [config, hardware-object]

    - name: Deploy simulator hardware-object config
      ansible.builtin.copy:
        src: "../../{{ mxcube_config_dir }}/"
        dest: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}/"
        owner: "{{ service_user }}"
        mode: preserve
      tags: [config, hardware-object]

    # BLISS overlay — demo.yaml/ is the standalone mockup config by default;
    # when use_bliss is true, this replaces only the files that actually
    # differ for real BLISS hardware (motors/shutters/nstate objects,
    # bliss_proxy, session), same overlay pattern as lims-icat.overlay/
    # below. bliss_proxy.yaml/lims.yaml themselves already exist in
    # demo.yaml/ either way — only beamline.yaml's references to them change.
    - name: Apply BLISS hardware-object overlay
      ansible.builtin.copy:
        src: "../../bliss.overlay/"
        dest: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}/"
        owner: "{{ service_user }}"
        mode: preserve
      when: use_bliss | default(false)
      tags: [config, hardware-object, bliss]

    # ICAT LIMS overlay — applied on top of demo.yaml/ (and the BLISS
    # overlay above, if any), replacing only the files that actually differ
    # for real ICAT instead of the ISPyB mockup: the lims: line in
    # beamline.yaml, and the new lims-icat.yaml hardware object itself.
    - name: Point beamline.yaml's lims object at ICAT
      ansible.builtin.lineinfile:
        path: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}/beamline.yaml"
        regexp: '^(\s*-\s*lims:\s*).*$'
        line: '\1lims-icat.yaml'
        backrefs: true
      when: use_icat | default(false)
      tags: [config, hardware-object, icat]

    - name: Deploy ICAT LIMS hardware-object config
      ansible.builtin.template:
        src: "../../lims-icat.overlay/lims-icat.yaml"
        dest: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}/lims-icat.yaml"
        owner: "{{ service_user }}"
        mode: '0644'
      when: use_icat | default(false)
      tags: [config, hardware-object, icat]

    # Server configuration (server.yaml) — deployed after repo sync/clone so it
    # overwrites the default file that comes with the repository.
    - name: Ensure mxcube-web config directory exists
      ansible.builtin.file:
        path: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}/mxcube-web"
        state: directory
        owner: "{{ service_user }}"
        mode: '0755'
      tags: [config, sso, ssl]

    - name: Deploy mxcubeweb server config (server.yaml)
      ansible.builtin.template:
        src: templates/server.yaml.j2
        dest: "{{ install_base_path }}/mxcubeweb/{{ mxcube_config_dir }}/mxcube-web/server.yaml"
        owner: "{{ service_user }}"
        mode: '0600'
      tags: [config, sso, ssl]

    - name: Create SSL certificate directory
      ansible.builtin.file:
        path: "{{ mxcubeweb_config.cert_pem | dirname }}"
        state: directory
        owner: "{{ service_user }}"
        mode: '0750'
      when: mxcubeweb_config.cert == "SIGNED" and mxcubeweb_config.cert_pem | length > 0
      tags: [config, ssl]

    - name: Copy SSL certificate from controller
      ansible.builtin.copy:
        src: "{{ mxcubeweb_config.local_cert_pem }}"
        dest: "{{ mxcubeweb_config.cert_pem }}"
        owner: "{{ service_user }}"
        mode: '0640'
      when: mxcubeweb_config.local_cert_pem | length > 0
      tags: [config, ssl]

    - name: Copy SSL private key from controller
      ansible.builtin.copy:
        src: "{{ mxcubeweb_config.local_cert_key }}"
        dest: "{{ mxcubeweb_config.cert_key }}"
        owner: "{{ service_user }}"
        mode: '0600'
      when: mxcubeweb_config.local_cert_key | length > 0
      tags: [config, ssl]

    - name: Check if mxcubeweb conda env exists
      ansible.builtin.stat:
        path: "{{ install_base_path }}/miniconda/envs/mxcubeweb"
      register: mxcubeweb_env
      tags: [conda, environment]

    - name: Clean mamba cache before mxcubeweb env creation
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/mamba clean -a -y"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      when: not mxcubeweb_env.stat.exists
      tags: [conda, environment]

    - name: Create mxcubeweb conda environment from conda-environment.yml
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/mamba env create --file {{ install_base_path }}/mxcubeweb/conda-environment.yml"
      become_user: "{{ service_user }}"
      become: true
      changed_when: true
      when: not mxcubeweb_env.stat.exists
      async: 1800
      poll: 30
      tags: [conda, environment]

    - name: Update mxcubeweb conda environment from conda-environment.yml
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/mamba env update -n mxcubeweb --file {{ install_base_path }}/mxcubeweb/conda-environment.yml --prune"
      become_user: "{{ service_user }}"
      become: true
      changed_when: true
      when: mxcubeweb_env.stat.exists and not (skip_env_update | default(false) | bool)
      async: 1800
      poll: 30
      tags: [conda, environment, update, env_update]

    - name: Check if bliss_dev conda env is fully installed
      ansible.builtin.stat:
        path: "{{ install_base_path }}/miniconda/envs/bliss_dev/bin/bliss"
      register: bliss_dev_env
      when: use_bliss | default(false)
      tags: [conda, environment, bliss]

    - name: Clean mamba cache before BLISS env creation
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/bin/mamba clean -a -y"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      when: (use_bliss | default(false)) and not bliss_dev_env.stat.exists
      tags: [conda, environment, bliss, cache]

    - name: Create bliss conda environment using Makefile
      ansible.builtin.shell:
        cmd: |
          source {{ install_base_path }}/miniconda/etc/profile.d/conda.sh
          conda activate base
          make bl_env NAME=bliss_dev
      args:
        chdir: "{{ install_base_path }}/bliss"
        executable: /bin/bash
      environment:
        TMPDIR: /tmp
      become_user: "{{ service_user }}"
      become: true
      changed_when: true
      when: (use_bliss | default(false)) and not bliss_dev_env.stat.exists
      async: 1800
      poll: 60
      tags: [conda, environment, bliss]

    - name: Install blissdemo in development mode
      ansible.builtin.shell:
        cmd: |
          source {{ install_base_path }}/miniconda/etc/profile.d/conda.sh
          conda activate bliss_dev
          conda list pip | grep -q '^pip ' || mamba install --yes pip -c conda-forge
          pip install -e ./blissdemo
      args:
        chdir: "{{ install_base_path }}/bliss"
        executable: /bin/bash
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      when: use_bliss | default(false)
      tags: [conda, environment, bliss, update]

    - name: Fix ownership of mxcubeweb conda env (ensure service_user can write site-packages)
      ansible.builtin.shell:
        cmd: "chown -R {{ service_user }} {{ install_base_path }}/miniconda/envs/mxcubeweb"
      changed_when: false
      tags: [python, dependencies, mxcubeweb, update]

    - name: Fix attrs in mxcubeweb env (required by pip/poetry)
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/pip install --force-reinstall 'attrs>=22.1.0'"
      environment:
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      tags: [python, dependencies, mxcubeweb, update]

    - name: Remove any stale Poetry-managed virtualenv for mxcubeweb
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/poetry env remove --all"
      args:
        chdir: "{{ install_base_path }}/mxcubeweb"
      environment:
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      failed_when: false
      tags: [python, dependencies, mxcubeweb, update]

    - name: Install Mxcubeweb dependencies with Poetry
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/poetry install"
      args:
        chdir: "{{ install_base_path }}/mxcubeweb"
      environment:
        POETRY_VIRTUALENVS_CREATE: "false"
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      tags: [python, dependencies, mxcubeweb, update]

    - name: Install mxcubecore in editable mode (no-deps)
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/pip install -e . --no-deps"
      args:
        chdir: "{{ install_base_path }}/mxcubecore"
      environment:
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      tags: [python, dependencies, mxcubecore, update]

    - name: Install extra pip packages in mxcubeweb env
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/pip install {{ conda_environments.mxcube.pip_packages | join(' ') }}"
      environment:
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      tags: [python, dependencies, mxcubeweb, update]

    # Frontend build
    - name: Install UI dependencies
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/pnpm --prefix ui install"
      args:
        chdir: "{{ install_base_path }}/mxcubeweb"
      environment:
        # pnpm's shebang is `#!/usr/bin/env node` — without the env's bin/
        # on PATH, `env` can't find node even though we call pnpm itself
        # by absolute path.
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
        # Without this, pnpm refuses to purge/reinstall a stale
        # node_modules (e.g. after a lockfile change) because it wants an
        # interactive confirmation it can never get from Ansible.
        CI: "true"
      become_user: "{{ service_user }}"
      become: true
      changed_when: false
      async: 1800
      poll: 30
      tags: [ui, dependencies, frontend, update]

    - name: Build UI
      ansible.builtin.command:
        cmd: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin/pnpm --prefix ui build"
      args:
        chdir: "{{ install_base_path }}/mxcubeweb"
      environment:
        PATH: "{{ install_base_path }}/miniconda/envs/mxcubeweb/bin:{{ ansible_facts['env'].PATH }}"
      become_user: "{{ service_user }}"
      become: true
      async: 1800
      poll: 30
      tags: [ui, build, frontend, update]

    # Docker containers management

    - name: Create directory for Docker images
      ansible.builtin.file:
        path: "{{ install_base_path }}/docker-images"
        state: directory
        owner: "{{ service_user }}"
        mode: '0755'
      when: use_docker | default(false)
      tags: [docker, setup]

    - name: Download arinax Docker image
      ansible.builtin.get_url:
        url: "{{ arinax_docker_image_url }}"
        dest: "{{ install_base_path }}/docker-images/arinax.tar"
        mode: '0644'
        force: false
      become_user: "{{ service_user }}"
      when: arinax_docker_image_url | default('') | length > 0
      tags: [docker, images]

    - name: Download flex Docker image
      ansible.builtin.get_url:
        url: "{{ flex_docker_image_url }}"
        dest: "{{ install_base_path }}/docker-images/flex.tar"
        mode: '0644'
        force: false
      become_user: "{{ service_user }}"
      when: flex_docker_image_url | default('') | length > 0
      tags: [docker, images]

    - name: Load arinax Docker image
      ansible.builtin.command:
        cmd: docker load -i "{{ install_base_path }}/docker-images/arinax.tar"
      when: arinax_docker_image_url | default('') | length > 0
      changed_when: true
      tags: [docker, images]

    - name: Load flex Docker image
      ansible.builtin.command:
        cmd: docker load -i "{{ install_base_path }}/docker-images/flex.tar"
      when: flex_docker_image_url | default('') | length > 0
      changed_when: true
      tags: [docker, images]

    - name: Add service_user to docker group
      ansible.builtin.user:
        name: "{{ service_user }}"
        groups: docker
        append: true
      when: use_docker | default(false)
      tags: [docker, setup]

    - name: Create directory for docker-compose project
      ansible.builtin.file:
        path: "{{ install_base_path }}/docker-compose"
        state: directory
        owner: "{{ service_user }}"
        mode: '0755'
      when: use_docker | default(false)
      tags: [docker, setup]

    - name: Deploy docker-compose file for hardware simulators
      ansible.builtin.copy:
        src: "../docker-compose.yml"
        dest: "{{ install_base_path }}/docker-compose/docker-compose.yml"
        owner: "{{ service_user }}"
        mode: '0644'
      when: use_docker | default(false)
      tags: [docker, setup]

    # Remove any stale containers holding these fixed names (e.g. left over
    # from a manual run, or a prior deploy from a different project_src) so
    # docker-compose doesn't hit a name conflict trying to recreate them.
    - name: Remove any stale simulator containers with conflicting names
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop:
        - flex-server
        - arinax-md
      when: use_docker | default(false)
      tags: [docker, setup]

    - name: Start Docker containers with docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ install_base_path }}/docker-compose"
        state: present
      become: true
      when: use_docker | default(false)
      tags: [docker]

    # ICAT stack (opt-in, use_icat) — separate compose project from the
    # hardware simulators above. Registry credentials come from vault.yml
    # if set there, otherwise prompted for interactively below. GitLab and
    # Harbor are separate auth systems with separate credentials — do NOT
    # assume the same username/password works for both. In particular,
    # Harbor with SSO typically rejects your regular login password for
    # `docker login`/registry API auth; it wants the CLI secret from your
    # Harbor profile page instead.
    - name: Prompt for ESRF GitLab registry username (not set in vault.yml)
      ansible.builtin.pause:
        prompt: "ESRF GitLab registry username for ICAT images (gitlab-registry.esrf.fr)"
      register: icat_gitlab_registry_user_prompt
      when: (use_icat | default(false)) and (icat_gitlab_registry_user | length == 0)
      tags: [icat]

    - name: Prompt for ESRF GitLab registry password/token (not set in vault.yml)
      ansible.builtin.pause:
        prompt: "ESRF GitLab registry password or personal access token (input hidden)"
        echo: false
      register: icat_gitlab_registry_password_prompt
      when: (use_icat | default(false)) and (icat_gitlab_registry_password | length == 0)
      no_log: true
      tags: [icat]

    - name: Prompt for ESRF Harbor registry username (not set in vault.yml)
      ansible.builtin.pause:
        prompt: "ESRF Harbor registry username for ICAT images (harbor.esrf.fr)"
      register: icat_harbor_registry_user_prompt
      when: (use_icat | default(false)) and (icat_harbor_registry_user | length == 0)
      tags: [icat]

    - name: Prompt for ESRF Harbor registry CLI secret (not set in vault.yml)
      ansible.builtin.pause:
        prompt: "ESRF Harbor CLI secret (Harbor UI -> your username -> User Profile -> CLI secret; NOT your login password, input hidden)"
        echo: false
      register: icat_harbor_registry_password_prompt
      when: (use_icat | default(false)) and (icat_harbor_registry_password | length == 0)
      no_log: true
      tags: [icat]

    - name: Store ESRF registry credentials
      ansible.builtin.set_fact:
        icat_gitlab_registry_user: "{{ icat_gitlab_registry_user_prompt.user_input | default(icat_gitlab_registry_user) }}"
        icat_gitlab_registry_password: "{{ icat_gitlab_registry_password_prompt.user_input | default(icat_gitlab_registry_password) }}"
        icat_harbor_registry_user: "{{ icat_harbor_registry_user_prompt.user_input | default(icat_harbor_registry_user) }}"
        icat_harbor_registry_password: "{{ icat_harbor_registry_password_prompt.user_input | default(icat_harbor_registry_password) }}"
      when: use_icat | default(false)
      no_log: true
      tags: [icat]

    - name: Log in to ESRF GitLab registry (ICAT images)
      community.docker.docker_login:
        registry_url: gitlab-registry.esrf.fr
        username: "{{ icat_gitlab_registry_user }}"
        password: "{{ icat_gitlab_registry_password }}"
      when: use_icat | default(false)
      no_log: true
      tags: [icat]

    - name: Log in to ESRF Harbor registry (ICAT images)
      community.docker.docker_login:
        registry_url: harbor.esrf.fr
        username: "{{ icat_harbor_registry_user }}"
        password: "{{ icat_harbor_registry_password }}"
      when: use_icat | default(false)
      no_log: true
      tags: [icat]

    - name: Create directory for ICAT docker-compose project
      ansible.builtin.file:
        path: "{{ install_base_path }}/icat-compose/db-init"
        state: directory
        owner: "{{ service_user }}"
        mode: '0755'
      when: use_icat | default(false)
      tags: [icat]

    - name: Deploy ICAT docker-compose file
      ansible.builtin.copy:
        src: "../icat-docker-compose.yml"
        dest: "{{ install_base_path }}/icat-compose/docker-compose.yml"
        owner: "{{ service_user }}"
        mode: '0644'
      when: use_icat | default(false)
      tags: [icat]

    - name: Render ICAT stack .env file
      ansible.builtin.template:
        src: templates/icat.env.j2
        dest: "{{ install_base_path }}/icat-compose/.env"
        owner: "{{ service_user }}"
        mode: '0600'
      when: use_icat | default(false)
      tags: [icat]

    - name: Fetch ICAT seed database (small test fixture from upstream repo)
      ansible.builtin.get_url:
        url: "{{ icat_config.seed_sql_url }}"
        dest: "{{ install_base_path }}/icat-compose/db-init/small-test-db.sql"
        owner: "{{ service_user }}"
        mode: '0644'
        force: false
      when: use_icat | default(false)
      tags: [icat]

    - name: Remove any stale ICAT containers with conflicting names
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop:
        - icat-plus
        - "icat-{{ icat_config.icat_version }}"
        - auth-db
        - database
        - mongodb
        - activemq
      when: use_icat | default(false)
      tags: [icat]

    - name: Start ICAT containers with docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ install_base_path }}/icat-compose"
        state: present
      become: true
      when: use_icat | default(false)
      tags: [icat]

    # Systemd service
    - name: Create systemd service file
      ansible.builtin.template:
        src: templates/mxcubeweb.service.j2
        dest: "/etc/systemd/system/mxcubeweb-{{ vm_context }}.service"
        mode: '0644'
      notify: Reload systemd
      tags: [service, systemd]

    - name: Kill stale BLISS shell sessions
      ansible.builtin.shell: pkill -TERM -f 'bliss.shell.main' 2>/dev/null; true
      changed_when: false
      failed_when: false
      when: use_bliss | default(false)
      tags: [service, systemd, bliss]

    - name: Kill any remaining process holding BLISS REST port
      ansible.builtin.shell: fuser -k {{ bliss_rest_port }}/tcp 2>/dev/null; true
      changed_when: false
      ignore_errors: true
      when: use_bliss | default(false)
      tags: [service, systemd, bliss]

    - name: Enable and restart MXCubeWeb service
      ansible.builtin.systemd:
        name: "mxcubeweb-{{ vm_context }}"
        enabled: true
        state: restarted
        daemon_reload: true
      tags: [service, systemd]

    # Bliss services
    - name: Create bliss server systemd service
      ansible.builtin.template:
        src: templates/bliss-server.service.j2
        dest: "/etc/systemd/system/bliss-server-{{ vm_context }}.service"
        mode: '0644'
      notify: Reload systemd
      when: use_bliss | default(false)
      tags: [service, systemd, bliss]

    - name: Create bliss session systemd service
      ansible.builtin.template:
        src: templates/bliss-session.service.j2
        dest: "/etc/systemd/system/bliss-session-{{ vm_context }}.service"
        mode: '0644'
      notify: Reload systemd
      when: use_bliss | default(false)
      tags: [service, systemd, bliss]

    - name: Enable and restart Bliss server service
      ansible.builtin.systemd:
        name: "bliss-server-{{ vm_context }}"
        enabled: true
        state: restarted
        daemon_reload: true
      when: use_bliss | default(false)
      tags: [service, systemd, bliss]

    - name: Enable and restart Bliss session service
      ansible.builtin.systemd:
        name: "bliss-session-{{ vm_context }}"
        enabled: true
        state: restarted
        daemon_reload: true
      when: use_bliss | default(false)
      tags: [service, systemd, bliss]

    - name: Display deployment information
      ansible.builtin.debug:
        msg: >-
          Deployment complete for {{ vm_context }}.
          Service: mxcubeweb-{{ vm_context }}.
          Logs: journalctl -u mxcubeweb-{{ vm_context }} -f
      tags: [always]

    - name: Display BLISS service information
      ansible.builtin.debug:
        msg: >-
          BLISS server: bliss-server-{{ vm_context }}.
          BLISS session: bliss-session-{{ vm_context }}.
          BLISS REST API: http://{{ ansible_facts['hostname'] }}:5000/api
      when: use_bliss | default(false)
      tags: [always]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true