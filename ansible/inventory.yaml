---
# Inventory of targets for MXCubeWeb deployment.
#
# Keep exactly ONE of the two host entries below active (uncomment the one
# you want, comment out / delete the other):
#
#   - "localhost"   deploys on this same machine, no SSH involved at all.
#   - "mxcube_vm1"  deploys on a remote VM/server over SSH — requires
#                   working SSH access to the target, set up independently
#                   of this playbook.

mxcube_vms:
  hosts:
    # --- Option A: deploy on THIS machine ---
    # localhost:
    #   ansible_connection: local
    #   ansible_python_interpreter: /usr/bin/python3
    #   vm_context: "mxcube_local"
    #   use_bliss: true    # applies bliss.overlay/ for real BLISS-backed hardware

    # --- Option B: deploy on a remote VM/server ---
    mxcube_vm1:
      ansible_host: mxcube-test-1
      ansible_python_interpreter: /usr/bin/python3
      vm_context: "mxcube_vm1"
      use_bliss: false    # no BLISS on this VM — standalone mockup hardware config

  vars:
    ansible_python_interpreter: /usr/bin/python3
