%YAML 1.2
---
class: MicroDiffractometer.MicroDiffractometer
configuration:
  username: MD
  exporter_address: localhost:9002
  num_centering_rounds: 5
  head_orientation: horizontal
  chip_definition_file: chip_definition.json
  commands:
    run_script: runScript
    save_centring_positions: saveCentringPositions
    scan_limits: getOmegaMotorDynamicScanLimits
  channels:
    beam_position_horizontal: BeamPositionHorizontal
    beam_position_vertical: BeamPositionVertical
    global_state: State
    phase_channel: CurrentPhase
  motors: [omega, focus, phiy, phiz, sampx, sampy, kappa, kappa_phi,
           frontlight, backlight]
  nstate_equipment: [frontlightswitch, backlightswitch, capillary, beamstop, zoom]

objects:
  omega: udiff_omega.yaml
  focus: udiff_phix.yaml
  phiy: udiff_phiy.yaml
  phiz: udiff_phiz.yaml
  sampx: udiff_sampx.yaml
  sampy: udiff_sampy.yaml
  kappa: udiff_kappa.yaml
  kappa_phi: udiff_kappaphi.yaml
  frontlight: udiff_frontlight.yaml
  backlight: udiff_backlight.yaml
  frontlightswitch: udiff_frontlightswitch.yaml
  backlightswitch: udiff_backlightswitch.yaml
  capillary: capillary.yaml
  beamstop: beamstop.yaml
  zoom: udiff_zoom.yaml
